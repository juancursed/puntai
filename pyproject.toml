[project]
name = "uniteval"
version = "0.1.0"
description = "Evaluador automático de pruebas unitarias Python con IA"
requires-python = ">=3.10"
# Mantener sincronizado con requirements.txt (Vercel instala desde aquí).
# pytest y pytest-json-report son dependencias de ejecución: runner.py los usa.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-json-report==1.5.0",
    "pydantic==2.9.2",
    "python-dotenv==1.2.2",
]

[tool.vercel]
# La app FastAPI vive en el paquete, no en un archivo de la raíz.
entrypoint = "uniteval.app:app"

[tool.pytest.ini_options]
# Solo las pruebas de UnitEval; Proyecto_test/ es el proyecto que se evalúa.
testpaths = ["tests"]
